{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Link Sent — CareBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/carebridge.css' %}">
</head>
<body class="cb-auth-body">
  <div class="auth-container">
    <div class="auth-card" style="text-align:center;">
      <i class="fa-solid fa-envelope-circle-check" style="font-size:4rem; color:var(--success); margin-bottom:1rem; display:block;"></i>
      <h2 class="auth-title">Check your inbox!</h2>
      <p class="auth-subtitle" style="margin-bottom:1.5rem;">We've sent a password reset link to your email address. Check your inbox (and spam folder just in case).</p>
      <a href="/login/" class="btn-submit" style="text-decoration:none; display:flex;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Back to Login
      </a>
    </div>
  </div>
</body>
</html>
