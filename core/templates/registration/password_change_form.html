{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — CareBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/carebridge.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <style>
    ul { padding-left: 1.25rem; margin-top: 4px; font-size: 0.78rem; color: var(--text-muted); }
    li { margin-bottom: 0.2rem; }
  </style>
</head>
<body class="cb-auth-body">
  <div class="auth-container">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <img src="{% static 'images/carebridge-logo.svg' %}" alt="CareBridge" style="height:52px; margin:0 auto; filter: drop-shadow(0 2px 6px rgba(67,160,227,0.25));">
    </div>
    <div class="auth-card">
      <div class="auth-header">
        <i class="fa-solid fa-shield-halved auth-icon"></i>
        <h2 class="auth-title">Change Password</h2>
        <p class="auth-subtitle">Use a strong password to keep your account secure</p>
      </div>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-lock"></i> Update Password
        </button>
      </form>
      <div class="auth-footer">
        <a href="/edit-profile/"><i class="fa-solid fa-arrow-left"></i> Back to Profile</a>
      </div>
    </div>
  </div>
</body>
</html>
