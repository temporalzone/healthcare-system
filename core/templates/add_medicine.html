{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Medicine — CareBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/carebridge.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
</head>
<body class="cb-form-body">
  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <i class="fa-solid fa-pills form-icon" style="color:var(--teal-hover);"></i>
        <h2 class="form-title">Add Medicine</h2>
        <p class="form-subtitle">Schedule a precise time for medication</p>
      </div>
      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-save"></i> Save Medicine
        </button>
      </form>
      <div class="form-footer">
        <a href="/"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
      </div>
    </div>
  </div>
</body>
</html>
