{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile — CareBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/carebridge.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
</head>
<body class="cb-form-body">
  <div class="form-container" style="max-width:560px;">
    <div class="form-card">
      <div class="form-header">
        <i class="fa-solid fa-user-gear form-icon"></i>
        <h2 class="form-title">Edit Profile</h2>
        <p class="form-subtitle">Update your CareBridge account details</p>
      </div>
      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="display:flex; gap:10px; margin-top:0.5rem;">
          <button type="submit" class="btn-submit" style="flex:1; margin-top:0;">
            <i class="fa-solid fa-save"></i> Save Changes
          </button>
          <a href="/" style="flex:1; display:flex; align-items:center; justify-content:center; padding:13px; border-radius:11px; background:var(--bg); color:var(--text-muted); border:1.5px solid var(--border); font-weight:600; font-size:0.95rem; text-decoration:none; transition:all 0.18s;"
            onmouseover="this.style.background='var(--bg-alt)'; this.style.color='var(--text-main)'"
            onmouseout="this.style.background='var(--bg)'; this.style.color='var(--text-muted)'">
            Cancel
          </a>
        </div>
      </form>
      <div style="text-align:right; margin-top:1rem;">
        <a href="/password-change/" style="color:var(--primary); font-weight:600; font-size:0.88rem;">
          <i class="fa-solid fa-lock"></i> Change Password
        </a>
      </div>
    </div>
  </div>
</body>
</html>
