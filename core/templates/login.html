{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CareBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/carebridge.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
</head>
<body class="cb-auth-body">
  <div class="auth-container">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <img src="{% static 'images/carebridge-logo.svg' %}" alt="CareBridge" style="height:52px; margin:0 auto; filter: drop-shadow(0 2px 6px rgba(67,160,227,0.25));">
    </div>
    <div class="auth-card">
      <div class="auth-header">
        <i class="fa-solid fa-user-lock auth-icon"></i>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Login to access your health dashboard</p>
      </div>

      {% if messages %}
      <div style="margin-bottom:1.2rem;">
        {% for message in messages %}
        <div style="padding:10px 14px; border-radius:10px; font-size:0.85rem; font-weight:500; margin-bottom:6px;
             background:{% if message.tags == 'error' %}#fee2e2; color:#991b1b; border:1px solid #fecaca;{% else %}#dcfce7; color:#166534; border:1px solid #bbf7d0;{% endif %}">
          <i class="fa-solid fa-{% if message.tags == 'error' %}circle-xmark{% else %}circle-check{% endif %}" style="margin-right:6px;"></i>
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="text-align:right; margin-top:-0.5rem; margin-bottom:1rem;">
          <a href="/password-reset/" style="font-size:0.82rem; color:var(--primary); font-weight:500;">
            Forgot password?
          </a>
        </div>
        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register/">Register here</a>
      </div>
    </div>
  </div>
</body>
</html>
