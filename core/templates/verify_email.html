{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — CareBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/carebridge.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <style>
    .otp-input input {
      text-align: center;
      letter-spacing: 0.35em;
      font-size: 1.4rem;
      font-weight: 700;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--bg);
      width: 100%;
      outline: none;
      transition: all 0.18s;
      color: var(--text-main);
    }
    .otp-input input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(67,160,227,0.15);
      background: #fff;
    }
    .timer-pills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
    }
    .timer-pill {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }
  </style>
</head>
<body class="cb-auth-body">
  <div class="auth-container">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <img src="{% static 'images/carebridge-logo.svg' %}" alt="CareBridge" style="height:52px; margin:0 auto; filter: drop-shadow(0 2px 6px rgba(67,160,227,0.25));">
    </div>
    <div class="auth-card">
      <div class="auth-header">
        <i class="fa-solid fa-envelope-open-text auth-icon" style="color:var(--primary);"></i>
        <h2 class="auth-title">Verify your email</h2>
        <p class="auth-subtitle">Enter the 6-digit OTP sent to <strong>{{ email }}</strong></p>
      </div>

      <div class="timer-pills">
        <span id="otpExpiry" class="timer-pill"><i class="fa-regular fa-clock"></i> OTP expires in --:--</span>
        <span id="resendCooldown" class="timer-pill"><i class="fa-solid fa-rotate-right"></i> Resend available now</span>
      </div>

      {% if messages %}
      <div style="margin-bottom:1.2rem;">
        {% for message in messages %}
        <div style="padding:10px 14px; border-radius:10px; font-size:0.85rem; font-weight:500; margin-bottom:6px;
             background:{% if message.tags == 'error' %}#fee2e2; color:#991b1b; border:1px solid #fecaca;{% elif message.tags == 'warning' %}#fef3c7; color:#92400e; border:1px solid #fde68a;{% else %}#dcfce7; color:#166534; border:1px solid #bbf7d0;{% endif %}">
          <i class="fa-solid fa-{% if message.tags == 'error' %}circle-xmark{% elif message.tags == 'warning' %}triangle-exclamation{% else %}circle-check{% endif %}" style="margin-right:6px;"></i>
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <div class="otp-input">
          {{ form.as_p }}
        </div>
        <div style="display:flex; gap:10px; margin-top:1rem;">
          <button type="submit" name="action" value="verify" class="btn-submit" style="flex:1; margin-top:0;">
            <i class="fa-solid fa-shield-check"></i> Verify OTP
          </button>
          <button id="resendBtn" type="submit" name="action" value="resend" formnovalidate
            style="flex:1; padding:13px; border-radius:11px; background:var(--bg-alt); color:var(--text-main); border:1.5px solid var(--border); font-family:inherit; font-weight:600; font-size:0.92rem; cursor:pointer; transition:all 0.18s;">
            <i class="fa-solid fa-rotate-right"></i> Resend OTP
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const otpExpiresAtRaw     = "{{ otp_expires_at|default_if_none:'' }}";
    const resendAvailableAtRaw = "{{ resend_available_at|default_if_none:'' }}";
    const otpExpiresAt     = otpExpiresAtRaw     ? Number(otpExpiresAtRaw)     : null;
    const resendAvailableAt = resendAvailableAtRaw ? Number(resendAvailableAtRaw) : null;
    const otpExpiryEl       = document.getElementById('otpExpiry');
    const resendCooldownEl  = document.getElementById('resendCooldown');
    const resendBtn         = document.getElementById('resendBtn');

    function fmt(s) {
      return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
    }

    function tick() {
      const now = Math.floor(Date.now() / 1000);
      if (otpExpiresAt) {
        const left = otpExpiresAt - now;
        otpExpiryEl.innerHTML = left > 0
          ? `<i class="fa-regular fa-clock"></i> OTP expires in ${fmt(left)}`
          : `<i class="fa-solid fa-circle-exclamation" style="color:var(--danger);"></i> OTP expired`;
      }
      if (resendAvailableAt) {
        const left = resendAvailableAt - now;
        if (left > 0) {
          resendCooldownEl.innerHTML = `<i class="fa-solid fa-rotate-right"></i> Resend in ${fmt(left)}`;
          resendBtn.disabled = true;
          resendBtn.style.opacity = '0.5';
          resendBtn.style.cursor = 'not-allowed';
        } else {
          resendCooldownEl.innerHTML = `<i class="fa-solid fa-rotate-right"></i> Resend available now`;
          resendBtn.disabled = false;
          resendBtn.style.opacity = '1';
          resendBtn.style.cursor = 'pointer';
        }
      }
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
